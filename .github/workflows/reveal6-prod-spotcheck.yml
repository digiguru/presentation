name: reveal6-prod-spotcheck

on:
  push:
    branches: [experiment/reveal-6-migration]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Use pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build exact Vercel preview output
        run: npm run preview:build
      - name: Serve preview output
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 --directory preview-site >/tmp/reveal6-preview.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8123/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/reveal6-preview.log
          exit 1
      - name: Compare production with Reveal 6 preview output
        env:
          PROD_BASE: https://art.digiguru.co.uk/presentation
          PREVIEW_BASE: http://127.0.0.1:8123
        run: node scripts/reveal6-prod-spotcheck.mjs
