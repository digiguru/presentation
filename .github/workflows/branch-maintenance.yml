name: Branch cleanup

on:
  push:
    branches:
      - agent/complete-presentation-hardening

permissions:
  contents: write

jobs:
  delete-audited-stale-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7

      - name: Delete branches superseded by master
        run: |
          git push origin --delete \
            GPT-Component-History \
            agent/dispatch-website-after-ci \
            agent/document-website-dispatch \
            agent/embed-presentation-metadata \
            agent/harden-presentation-ci \
            agent/rebase-harden-presentation-ci-on-master \
            chore/consolidate-dependabot-upgrades \
            dependabot/npm_and_yarn/yargs-18.0.0
