name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate presentation metadata
        run: npm run presentations:check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: gulp qunit
        env:
          CI: true

  dispatch-website:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger digiguru.github.io Pages workflow
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          test -n "$WEBSITE_DISPATCH_TOKEN" || { echo "WEBSITE_DISPATCH_TOKEN is not configured"; exit 1; }
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $WEBSITE_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/digiguru/digiguru.github.io/actions/workflows/jekyll.yml/dispatches \
            --data '{"ref":"main"}'
          echo "Website workflow dispatch accepted"
