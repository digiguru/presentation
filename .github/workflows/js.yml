name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: presentation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Use pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Validate Stage 1 clean runtime
        run: npm run stage1:check

      - name: Smoke test Stage 1 in Chrome
        run: npm run stage1:smoke

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Use pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (known legacy issue)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="/tmp/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory /tmp actionlint
          /tmp/actionlint

      - name: Test custom tooling
        run: npm run test:tooling

      - name: Validate presentation metadata
        run: npm run presentations:check

      - name: Validate local presentation assets
        run: npm run presentations:assets

      - name: Validate presentation accessibility
        run: npm run presentations:accessibility

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test Reveal runtime
        run: gulp qunit
        env:
          CI: true

      - name: Smoke test presentations
        run: npm run presentations:smoke

  dispatch-website:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger digiguru.github.io Pages workflow for this exact commit
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          PRESENTATION_SHA: ${{ github.sha }}
        run: |
          test -n "$WEBSITE_DISPATCH_TOKEN" || { echo "WEBSITE_DISPATCH_TOKEN is not configured"; exit 1; }
          [[ "$PRESENTATION_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid presentation SHA: $PRESENTATION_SHA"; exit 1; }
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $WEBSITE_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/digiguru/digiguru.github.io/actions/workflows/jekyll.yml/dispatches \
            --data "{\"ref\":\"main\",\"inputs\":{\"presentation_sha\":\"$PRESENTATION_SHA\"}}"
          echo "Website workflow dispatch accepted for presentation $PRESENTATION_SHA"
