name: stage7-migrate

on:
  push:
    branches: [agent/stage-7-canonical-sources]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/stage-7-canonical-sources

      - name: Use pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Rewrite presentation sources
        run: node scripts/stage7-migrate-sources.mjs

      - name: Commit canonical sources
        run: |
          git add -- '*.html'
          test -n "$(git status --short)" || { echo "No source changes generated"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Migrate presentation sources to pure-v1"
          git push origin HEAD:agent/stage-7-canonical-sources
