name: Test website dispatch token

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/test-website-dispatch.yml

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger digiguru.github.io workflow
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          test -n "$WEBSITE_DISPATCH_TOKEN" || { echo "WEBSITE_DISPATCH_TOKEN is not configured"; exit 1; }
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $WEBSITE_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/digiguru/digiguru.github.io/actions/workflows/jekyll.yml/dispatches \
            --data '{"ref":"main"}'
          echo "Website workflow dispatch accepted"
