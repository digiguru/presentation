name: pure-remote-debug

on:
  push:
    branches:
      - agent/stage2-legacy-compatibility

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe exact Vercel deployment
        shell: bash
        run: |
          set -uo pipefail
          base="https://presentation-11si6veq5-digiguru-s-team.vercel.app"
          alias="https://presentation-git-agent-stage2-legacy-com-ad0323-digiguru-s-team.vercel.app"

          probe() {
            local url="$1"
            echo "=== $url ==="
            curl --silent --show-error --location --output /tmp/body --dump-header /tmp/headers --write-out 'status=%{http_code} final=%{url_effective} type=%{content_type}\n' "$url" || true
            sed -n '1,20p' /tmp/headers || true
            file /tmp/body || true
            wc -c /tmp/body || true
          }

          probe "$base/bigbus.html"
          probe "$base/assets/adamhall.jpg"
          probe "$base/assets/robot-wannabe.png"
          probe "$base/assets/OpenAI_Logo.png"
          probe "$base/themes/AND.css"
          probe "$alias/bigbus.html"
          probe "$alias/assets/adamhall.jpg"
          probe "$alias/themes/AND.css"
