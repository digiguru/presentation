name: dependency migration validation

on:
  push:
    branches:
      - chore/consolidate-dependabot-upgrades

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/consolidate-dependabot-upgrades

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Rebuild lockfile from scratch
        run: rm package-lock.json && npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
          else
            git commit -m "Regenerate lockfile for consolidated upgrades"
            git push
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: gulp qunit
        env:
          CI: true
